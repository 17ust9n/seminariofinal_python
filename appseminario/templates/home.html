{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starssenger - Inicio</title>
    <link rel="stylesheet" href="{% static 'estilos.css' %}?v=125">
</head>
<body>

<div class="wrap">
    <div id="home" class="screen on">
        <!-- Header con logo y estado -->
        <header>
            <img class="logo" id="lg2" src="{% static 'logo/Starssenger.png' %}" alt="Starssenger Logo">
            <b class="brand">Starssenger</b>
            <span class="sp"></span>
            <span class="dot on" id="dot" title="En línea"></span>
        </header>
        
        <!-- Buscador estilizado -->
        <div class="searchwrap">
            <input id="homeSearch" 
                   type="text" 
                   placeholder="Buscar contacto por nombre o número…" 
                   oninput="filterList()" 
                   autocomplete="off">
        </div>
        
        <!-- Lista de Contactos -->
        <div id="list">
            {% for contact in contacts %}
                <div class="row contact-card" id="chat-item-{{ contact.id }}" onclick="openChat('{{ contact.phone_number }}')">
                    <!-- Avatar con la primera letra del nombre -->
                    <div class="av">
                        {{ contact.name|slice:":1"|upper }}
                    </div>
                    
                    <!-- Información del contacto -->
                    <div class="rmid">
                        <div class="rname contact-name">{{ contact.name }}</div>
                        <div class="rprev contact-phone">{{ contact.phone_number }}</div>
                    </div>
                </div>
            {% empty %}
                <div class="empty">No hay contactos guardados.</div>
            {% endfor %}
        </div>

        <!-- Botón Flotante (FAB Nuevo Chat) -->
        <button id="fab" onclick="openNewChat()" title="Nuevo chat" aria-label="Nuevo chat">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </button>

        <!-- Navegación Inferior (Tabs con colores verdes/neón) -->
        <nav class="tabs">
            <button class="act" onclick="window.location.href='{% url 'home' %}'">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
                <span>Chats</span>
            </button>
            <button onclick="window.location.href='{% url 'profile' %}'">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>Perfil</span>
            </button>
        </nav>
    </div>
</div>

<script>
function openChat(phone) {
    if (phone) window.location.href = `/chat/?to=${phone}`;
}

function openNewChat() { 
    window.location.href = "{% url 'newchat' %}"; 
}

function filterList() {
    const query = document.getElementById('homeSearch').value.toLowerCase().trim();
    const items = document.querySelectorAll('#list .contact-card');
    
    items.forEach(item => {
        const nameEl = item.querySelector('.contact-name');
        const phoneEl = item.querySelector('.contact-phone');

        const name = nameEl ? nameEl.textContent.toLowerCase() : '';
        const phone = phoneEl ? phoneEl.textContent.toLowerCase() : '';

        if (name.includes(query) || phone.includes(query)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>

</body>
</html>
