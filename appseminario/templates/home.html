{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starssenger - Inicio</title>
    <link rel="stylesheet" href="{% static 'estilos.css' %}?v=125">
    
    <!-- OPTIMIZACIÓN: Cargamos Libsodium de forma local y estable desde tu Django -->
    <script src="{% static 'js/sodium.js' %}"></script>
</head>
<body>

<div class="wrap">
    <div id="home" class="screen on">
        <!-- Header con logo y estado -->
        <header>
            <img class="logo" id="lg2" src="{{ MEDIA_URL }}Starssenger.png" alt="Starssenger Logo">
            <b class="brand">Starssenger</b>
            <span class="sp"></span>
            <span class="dot on" id="dot" title="En línea"></span>
        </header>
        
        <!-- Buscador estilizado -->
        <div class="searchwrap">
            <input id="homeSearch" 
                   type="text" 
                   placeholder="Buscar contacto por nombre o número…" 
                   oninput="filterList()" 
                   autocomplete="off">
        </div>
        
        <!-- Lista de Contactos -->
        <div id="list">
            {% for contact in contacts %}
                <div class="row contact-card" id="chat-item-{{ contact.id }}" onclick="openChat('{{ contact.phone_number }}')">
                    <!-- Avatar con la primera letra del nombre -->
                    <div class="av">
                        {{ contact.name|slice:":1"|upper }}
                    </div>
                    
                    <!-- Información del contacto -->
                    <div class="rmid">
                        <div class="rname contact-name">{{ contact.name }}</div>
                        <div class="rprev contact-phone">{{ contact.phone_number }}</div>
                    </div>
                </div>
            {% empty %}
                <div class="empty">No hay contactos guardados.</div>
            {% endfor %}
        </div>

        <!-- Botón Flotante (FAB Nuevo Chat) con Ícono de Lápiz -->
        <button id="fab" onclick="openNewChat()" title="Nuevo chat" aria-label="Nuevo chat">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
        </button>

        <!-- Navegación Inferior (Tabs con colores verdes/neón) -->
        <nav class="tabs">
            <button class="act" onclick="window.location.href='{% url 'home' %}'">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>Inicio</span>
            </button>
            <button onclick="window.location.href='{% url 'profile' %}'">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>Perfil</span>
            </button>
        </nav>
    </div>
</div>

<script>
// --- Integración de Dipsodium / Libsodium ---
let keyPair = null;

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function initCrypto() {
    if (typeof sodium === 'undefined') {
        console.log("Esperando que cargue el objeto de Sodium local...");
        setTimeout(initCrypto, 50);
        return;
    }

    await sodium.ready;
    console.log("Libsodium local cargado correctamente en Home.");

    // CONSISTENCIA: Usamos las mismas variables fijas del onboarding ('sp_privkey' y 'sp_pubkey')
    let storedPrivateKey = localStorage.getItem("sp_privkey");
    let storedPublicKey = localStorage.getItem("sp_pubkey");

    if (!storedPrivateKey || !storedPublicKey) {
        keyPair = sodium.crypto_box_keypair();
        
        // CORRECCIÓN CRÍTICA: Cambiado a los métodos estables .to_base64 de la versión web
        storedPrivateKey = sodium.to_base64(keyPair.privateKey);
        storedPublicKey = sodium.to_base64(keyPair.publicKey);

        localStorage.setItem("sp_privkey", storedPrivateKey);
        localStorage.setItem("sp_pubkey", storedPublicKey);
        
        console.log("Nuevas claves generadas en el Home.");
        enviarClavePublicaAlServidor(storedPublicKey);
    } else {
        // CORRECCIÓN CRÍTICA: Cambiado a .from_base64 para parsear los strings guardados
        keyPair = {
            privateKey: sodium.from_base64(storedPrivateKey),
            publicKey: sodium.from_base64(storedPublicKey)
        };
        console.log("Claves criptográficas sincronizadas con el Onboarding.");
        
        // Sincroniza con el endpoint de tu views.py
        enviarClavePublicaAlServidor(storedPublicKey);
    }
}

function enviarClavePublicaAlServidor(pubKeyBase64) {
    fetch("/actualizar-clave-publica/", { 
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({ public_key: pubKeyBase64 })
    })
    .then(response => {
        if (!response.ok) throw new Error("Error al guardar la llave.");
        return response.json();
    })
    .then(data => console.log("Llave pública guardada en Django:", data))
    .catch(error => console.error("No se pudo registrar la llave en Django:", error));
}

window.addEventListener('DOMContentLoaded', initCrypto);

// --- Funciones de Interfaz ---
function openChat(phone) {
    if (phone) window.location.href = `/chat/?to=${phone}`;
}

function openNewChat() { 
    window.location.href = "{% url 'newchat' %}"; 
}

function filterList() {
    const query = document.getElementById('homeSearch').value.toLowerCase().trim();
    const items = document.querySelectorAll('#list .contact-card');
    
    items.forEach(item => {
        const nameEl = item.querySelector('.contact-name');
        const phoneEl = item.querySelector('.contact-phone');

        const name = nameEl ? nameEl.textContent.toLowerCase() : '';
        const phone = phoneEl ? phoneEl.textContent.toLowerCase() : '';

        if (name.includes(query) || phone.includes(query)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>

</body>
</html>
