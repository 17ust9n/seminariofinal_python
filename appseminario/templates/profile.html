{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starssenger - Perfil</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="{% static 'estilos.css' %}?v=123">
</head>

<body>

<div id="profile" class="screen">
  <header>
    <button class="back" onclick="goHome()" aria-label="Atrás">←</button>
    <b>Perfil</b>
  </header>
  
  <div class="prof">
    <div class="bigav" id="profAv">🙂</div>
    <label for="setNum">Tu número (con código de país)</label>
    <input id="setNum" inputmode="numeric">
    
    <label>Seguridad</label>
    <div class="seg">
      <button id="sOff2" type="button" onclick="setSec(0)">🔓 Normal</button>
      <button id="sOn2" type="button" onclick="setSec(1)">🛡️ Blindado</button>
    </div>
    <p class="tag">🛡️ Blindado: los mensajes se borran solos a los 45s y no se guarda nada en el teléfono.</p>
    
    <button class="btn" style="margin-top:16px" type="button" onclick="saveProfile()">Guardar</button>
    <button class="btn" style="margin-top:10px; background-color: #e28;" type="button" onclick="logout()">Cerrar Sesión</button>
    <p class="tag" style="margin-top:20px">🔐 Todos los mensajes y llamadas van cifrados extremo a extremo. La clave sale de los números y no viaja.</p>
  </div>

<!-- LÓGICA JAVASCRIPT — PERFIL Y NAVEGACIÓN GLOBAL -->
<script>
  let currentSecureMode = 0; // 0: Normal, 1: Blindado

  document.addEventListener('DOMContentLoaded', function() {
    // Cargar teléfono actual de localStorage o sesión Django
    const savedPhone = localStorage.getItem('userPhone') || '{{ request.user.username }}';
    const savedSecure = localStorage.getItem('securityMode') || '0';

    const setNum = document.getElementById('setNum');
    if (setNum && savedPhone) {
      setNum.value = savedPhone;
    }
    
    setSec(parseInt(savedSecure, 10));
  });

  // --- FUNCIONES DE NAVEGACIÓN GLOBAL ---
  function goHome() {
    window.location.href = "{% url 'home' %}";
  }

  function openProfile() {
    window.location.href = "{% url 'profile' %}";
  }

  function openNewChat() {
    window.location.href = "{% url 'newchat' %}";
  }

  function openCalls() {
    window.location.href = "{% url 'call' %}";
  }

  function openChat(roomId) {
    if (roomId) {
      window.location.href = "/chat/" + roomId + "/";
    } else {
      window.location.href = "{% url 'chat' %}";
    }
  }

  function logout() {
    localStorage.clear();
    window.location.href = "{% url 'onboard' %}";
  }

  // --- FUNCIONES ESPECÍFICAS DE PERFIL ---
  function setSec(mode) {
    currentSecureMode = mode;
    const btnOff = document.getElementById('sOff2');
    const btnOn = document.getElementById('sOn2');

    if (btnOff && btnOn) {
      if (mode === 1) {
        btnOn.classList.add('act');
        btnOff.classList.remove('act');
      } else {
        btnOff.classList.add('act');
        btnOn.classList.remove('act');
      }
    }
  }

  function saveProfile() {
    const phoneInput = document.getElementById('setNum');
    if (!phoneInput || !phoneInput.value.trim()) {
      alert('Por favor, ingresa un número de teléfono válido.');
      return;
    }

    const newPhone = phoneInput.value.trim();
    localStorage.setItem('userPhone', newPhone);
    localStorage.setItem('securityMode', currentSecureMode.toString());

    alert('Perfil actualizado correctamente.');
    goHome();
  }
</script>

</body>
</html>
