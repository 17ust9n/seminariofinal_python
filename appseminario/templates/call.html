{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Starssenger - Llamada{% endblock %}</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="{% static 'estilos.css' %}?v=125">

    <!-- Cargamos Libsodium desde CDN (Para cifrado de señalización / WebRTC) -->
    <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js" async></script>

    {% block extra_head %}{% endblock %}
</head>

<body>
  <!-- Contenedor Principal de la Llamada -->
  <div id="call" class="screen call-screen on">
    <div id="grid" class="call-grid"></div>
    
    <div id="voiceface" class="voice-face">
      <div class="vfav" id="vfAv">U</div>
      <div id="vfName" class="vf-name">Conectando...</div>
      <div id="vfState" class="vf-state">Llamando</div>
    </div>
    
    <!-- Streams de Audio Ocultos -->
    <div id="audios" class="hidden-audios"></div>
    
    <!-- Teclado / Acciones rápidas en llamada -->
    <div id="callkeys" class="call-keys"></div>
    
    <!-- Acciones principales -->
    <div class="call-actions">
      <button id="addcall" class="btn-call-action add" title="Sumar a la llamada" aria-label="Sumar a la llamada">＋</button>
      <button id="hang" class="btn-call-action hang">Colgar</button>
    </div>
  </div>

  <!-- Banner / Modal de Llamada Entrante -->
  <div id="incall" class="incall-banner">
    <div class="incall-info">
      <span class="incall-icon">📹</span>
      <b id="icName">Llamada entrante...</b>
    </div>
    <span class="sp"></span>
    <div class="incall-buttons">
      <button id="btnDecline" class="btn dec" onclick="declineCall()">Rechazar</button>
      <button id="btnAnswer" class="btn acc" onclick="answerCall()">Contestar</button>
    </div>
  </div>

{% block extra_js %}
<!-- LÓGICA JAVASCRIPT — CALL -->
<script>
  document.addEventListener('DOMContentLoaded', async function() {
    // Inicializar Libsodium para el intercambio seguro de señalización WebRTC
    try {
      await sodium.ready;
      console.log("Libsodium cargado en la pantalla de llamada.");
    } catch (e) {
      console.error("Error al cargar Libsodium en llamada:", e);
    }

    const hangBtn = document.getElementById('hang');
    const addCallBtn = document.getElementById('addcall');
    const incallBanner = document.getElementById('incall');

    // Asignación de listeners
    if (hangBtn) hangBtn.addEventListener('click', hangup);
    if (addCallBtn) addCallBtn.addEventListener('click', openInvite);

    // Control de llamada entrante usando la clase .on de estilos.css
    if (typeof pendingCall !== 'undefined' && pendingCall) {
      const icName = document.getElementById('icName');
      if (icName) {
        icName.textContent = typeof nameFor === 'function' ? nameFor(pendingCall.from) : pendingCall.from;
      }
      if (incallBanner) incallBanner.classList.add('on');
    }
  });

  function hangup() {
    const callScreen = document.getElementById('call');
    if (callScreen) callScreen.classList.remove('on');
    
    // Detener streams WebRTC si existen
    if (window.localStream) {
      window.localStream.getTracks().forEach(track => track.stop());
      window.localStream = null;
    }

    // Redireccionar al home o cerrar ventana
    if (document.referrer) {
      window.location.href = document.referrer;
    } else {
      window.location.href = "{% url 'home' %}";
    }
  }

  function openInvite() {
    if (typeof openModal === 'function') {
      openModal('mInvite');
    } else {
      const mInvite = document.getElementById('mInvite');
      if (mInvite) mInvite.classList.add('on');
    }
  }

  function answerCall() {
    const incallBanner = document.getElementById('incall');
    if (incallBanner) incallBanner.classList.remove('on');
    
    const vfState = document.getElementById('vfState');
    if (vfState) vfState.textContent = 'En llamada';
    
    console.log("Llamada aceptada.");
  }

  function declineCall() {
    const incallBanner = document.getElementById('incall');
    if (incallBanner) incallBanner.classList.remove('on');
    
    hangup();
  }
</script>
{% endblock %}
</body>
</html>
