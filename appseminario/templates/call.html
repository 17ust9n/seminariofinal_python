<body>
    <div id="call" class="screen call-screen on">

```
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>

    <div id="voiceface" class="voice-face">
        <div class="vfav" id="vfAv">{{ peer_name|slice:":1"|upper }}</div>
        <div id="vfName" class="vf-name">{{ peer_name }}</div>
        <div id="vfState" class="vf-state">Conectando...</div>
    </div>

    <div class="call-actions">
        <button id="btnMic" class="cbtn" title="Silenciar micrófono">🎤</button>
        <button id="btnCam" class="cbtn" title="Apagar cámara">📷</button>
        <button id="btnFlip" class="cbtn" title="Cambiar cámara" style="display:none">🔄</button>
        <button id="hang" class="cbtn hang" title="Colgar">📞</button>
    </div>
</div>

<script>
    const CALL_ID = "{{ room_id|escapejs }}";
    const IS_CALLER = {{ is_caller|yesno:"true,false" }};
    const HOME_URL = "{% url 'home' %}";

    const ICE_SERVERS = [
        { urls: "stun:stun.l.google.com:19302" }
    ];

    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let lastSignal = 0;
    let remoteSet = false;
    let pendingIce = [];
    let ended = false;
    let polling = false;
    let answered = false;
    let offerSent = false;
    let facing = "user";

    const startedAt = Date.now();

    const $state = document.getElementById("vfState");
    const $face = document.getElementById("voiceface");
    const $remote = document.getElementById("remoteVideo");
    const $local = document.getElementById("localVideo");
    const $btnMic = document.getElementById("btnMic");
    const $btnCam = document.getElementById("btnCam");
    const $btnFlip = document.getElementById("btnFlip");

    function setState(text) {
        $state.textContent = text;
    }

    async function post(path, body) {
        try {
            const response = await fetch(path, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                console.error("POST error:", path, response.status);
                return null;
            }

            return await response.json();
        } catch (error) {
            console.error("POST exception:", path, error);
            return null;
        }
    }

    async function sendSignal(kind, payload) {
        console.log("Enviando signal:", kind);

        return await post(
            `/api/calls/${CALL_ID}/signal/`,
            { kind, payload }
        );
    }

    async function getMedia() {
        if (!navigator.mediaDevices?.getUserMedia) {
            console.error("getUserMedia no está disponible");
            return null;
        }

        try {
            return await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: {
                    facingMode: "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
        } catch (videoError) {
            console.warn("No se pudo obtener video:", videoError);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                $btnCam.style.display = "none";
                return stream;
            } catch (audioError) {
                console.error("No se pudo obtener audio:", audioError);
                return null;
            }
        }
    }

    function createPeerConnection() {
        pc = new RTCPeerConnection({
            iceServers: ICE_SERVERS
        });

        pc.onicecandidate = async event => {
            if (!event.candidate) return;

            console.log("ICE local:", event.candidate.candidate);

            await sendSignal(
                "ice",
                event.candidate.toJSON()
            );
        };

        pc.ontrack = event => {
            console.log("Track remoto:", event.track.kind);

            if (!event.streams?.[0]) return;

            remoteStream = event.streams[0];
            $remote.srcObject = remoteStream;
            $remote.play().catch(() => {});

            $face.classList.add("hidden");
            setState("En llamada");
        };

        pc.onconnectionstatechange = () => {
            console.log("Connection state:", pc.connectionState);

            switch (pc.connectionState) {
                case "connected":
                    answered = true;
                    setState("En llamada");
                    $face.classList.add("hidden");
                    break;

                case "connecting":
                    setState("Conectando...");
                    break;

                case "disconnected":
                    setState("Conexión interrumpida...");
                    break;

                case "failed":
                    endCall(true, "La conexión falló");
                    break;
            }
        };

        pc.oniceconnectionstatechange = () => {
            console.log("ICE state:", pc.iceConnectionState);
        };

        return pc;
    }

    async function createAndSendOffer() {
        if (!pc || offerSent) return;

        try {
            console.log("Creando offer...");

            const offer = await pc.createOffer({
                offerToReceiveAudio: true,
                offerToReceiveVideo: true
            });

            await pc.setLocalDescription(offer);

            await sendSignal("offer", {
                type: pc.localDescription.type,
                sdp: pc.localDescription.sdp
            });

            offerSent = true;
            console.log("Offer enviada");
        } catch (error) {
            console.error("Error creando offer:", error);
        }
    }

    async function startCall() {
        console.log("=================================");
        console.log("INICIANDO LLAMADA");
        console.log("CALL_ID:", CALL_ID);
        console.log("IS_CALLER:", IS_CALLER);
        console.log("=================================");

        setState(IS_CALLER ? "Solicitando cámara..." : "Esperando llamada...");

        localStream = await getMedia();

        if (!localStream) {
            setState("No se pudo acceder al micrófono/cámara");
            return;
        }

        $local.srcObject = localStream;
        $local.play().catch(() => {});

        createPeerConnection();

        localStream.getTracks().forEach(track => {
            console.log("Track local:", track.kind);
            pc.addTrack(track, localStream);
        });

        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter(d => d.kind === "videoinput");

            if (cameras.length > 1 && localStream.getVideoTracks().length) {
                $btnFlip.style.display = "";
            }
        } catch (error) {
            console.warn("No se pudieron enumerar cámaras");
        }

        if (IS_CALLER) {
            setState("Llamando...");
            await createAndSendOffer();
        } else {
            setState("Esperando conexión...");
        }

        pollLoop();
    }

    async function flushIce() {
        if (!pc || !remoteSet) return;

        for (const candidate of pendingIce) {
            try {
                await pc.addIceCandidate(
                    new RTCIceCandidate(candidate)
                );
            } catch (error) {
                console.error("Error ICE pendiente:", error);
            }
        }

        pendingIce = [];
    }

    async function handleSignal(signal) {
        if (!pc || ended) return;

        console.log("Signal recibida:", signal.kind);

        if (signal.kind === "offer") {
            if (IS_CALLER) return;

            try {
                await pc.setRemoteDescription(
                    new RTCSessionDescription(signal.payload)
                );

                remoteSet = true;
                await flushIce();

                const answer = await pc.createAnswer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });

                await pc.setLocalDescription(answer);

                await sendSignal("answer", {
                    type: pc.localDescription.type,
                    sdp: pc.localDescription.sdp
                });

                await post(
                    `/api/calls/${CALL_ID}/state/`,
                    { estado: "CO" }
                );

                setState("Conectando...");
            } catch (error) {
                console.error("Error procesando offer:", error);
            }

            return;
        }

        if (signal.kind === "answer") {
            if (!IS_CALLER) return;

            try {
                await pc.setRemoteDescription(
                    new RTCSessionDescription(signal.payload)
                );

                remoteSet = true;
                await flushIce();
            } catch (error) {
                console.error("Error aplicando answer:", error);
            }

            return;
        }

        if (signal.kind === "ice") {
            if (!signal.payload) return;

            if (remoteSet) {
                try {
                    await pc.addIceCandidate(
                        new RTCIceCandidate(signal.payload)
                    );
                } catch (error) {
                    console.error("Error agregando ICE:", error);
                }
            } else {
                pendingIce.push(signal.payload);
            }
        }
    }

    async function pollLoop() {
        if (ended) return;

        if (!polling) {
            polling = true;

            try {
                const response = await fetch(
                    `/api/calls/${CALL_ID}/signals/?after=${lastSignal}`,
                    {
                        credentials: "same-origin",
                        cache: "no-store"
                    }
                );

                if (response.status === 401) {
                    endCall(false, "Sesión expirada");
                    return;
                }

                if (response.ok) {
                    const data = await response.json();

                    for (const signal of data.signals || []) {
                        lastSignal = Math.max(
                            lastSignal,
                            Number(signal.id)
                        );

                        await handleSignal(signal);
                    }

                    if (data.estado === "FI" || data.estado === "RE") {
                        endCall(
                            false,
                            data.estado === "RE"
                                ? "Llamada rechazada"
                                : "Llamada finalizada"
                        );
                        return;
                    }

                    if (
                        IS_CALLER &&
                        !answered &&
                        Date.now() - startedAt > 45000
                    ) {
                        endCall(true, "Sin respuesta");
                        return;
                    }
                }
            } catch (error) {
                console.warn("Error polling:", error);
            } finally {
                polling = false;
            }
        }

        setTimeout(pollLoop, 500);
    }

    $btnMic.addEventListener("click", () => {
        if (!localStream) return;

        const track = localStream.getAudioTracks()[0];
        if (!track) return;

        track.enabled = !track.enabled;

        $btnMic.classList.toggle("off", !track.enabled);
        $btnMic.textContent = track.enabled ? "🎤" : "🔇";
        $btnMic.title = track.enabled
            ? "Silenciar micrófono"
            : "Activar micrófono";
    });

    $btnCam.addEventListener("click", () => {
        if (!localStream) return;

        const track = localStream.getVideoTracks()[0];
        if (!track) return;

        track.enabled = !track.enabled;

        $btnCam.classList.toggle("off", !track.enabled);
        $btnCam.textContent = track.enabled ? "📷" : "🚫";
        $btnCam.title = track.enabled
            ? "Apagar cámara"
            : "Encender cámara";

        $local.classList.toggle("off", !track.enabled);
    });

    function videoSender() {
        if (!pc) return null;

        return pc.getSenders().find(
            sender => sender.track?.kind === "video"
        );
    }

    $btnFlip.addEventListener("click", async () => {
        if (!localStream || !pc) return;

        const oldTrack = localStream.getVideoTracks()[0];
        if (!oldTrack) return;

        const wasEnabled = oldTrack.enabled;
        const next = facing === "user" ? "environment" : "user";

        try {
            oldTrack.stop();

            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { exact: next }
                }
            });

            const newTrack = stream.getVideoTracks()[0];
            newTrack.enabled = wasEnabled;

            const sender = videoSender();

            if (sender) {
                await sender.replaceTrack(newTrack);
            }

            localStream.removeTrack(oldTrack);
            localStream.addTrack(newTrack);

            $local.srcObject = localStream;

            facing = next;
            $local.style.transform =
                facing === "user" ? "scaleX(-1)" : "none";
        } catch (error) {
            console.error("Error cambiando cámara:", error);
        }
    });

    function endCall(notify, message) {
        if (ended) return;

        ended = true;

        if (notify) {
            post(
                `/api/calls/${CALL_ID}/state/`,
                { estado: "FI" }
            ).catch(() => {});
        }

        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }

        if (pc) pc.close();

        $face.classList.remove("hidden");
        setState(message || "Llamada finalizada");

        setTimeout(() => {
            window.location.href = HOME_URL;
        }, 1200);
    }

    document.getElementById("hang").addEventListener(
        "click",
        () => endCall(true, "Llamada finalizada")
    );

    window.addEventListener("beforeunload", () => {
        if (!ended && navigator.sendBeacon) {
            navigator.sendBeacon(
                `/api/calls/${CALL_ID}/state/`,
                new Blob(
                    [JSON.stringify({ estado: "FI" })],
                    { type: "application/json" }
                )
            );
        }
    });

    startCall();
</script>
