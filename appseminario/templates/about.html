<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerca de - Starssenger</title>
    <style>
        :root {
            --navy: #0f172a;
            --navy2: #1e293b;
            --navy-card: #1e293b;
            --green-accent: #10b981;
            --red-accent: #ef4444;
            --white: #ffffff;
            --mut-text: #94a3b8;
            --line-border: #334155;
            --nav-item-active: #10b981;
            --nav-item-inactive: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--navy);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Toolbar Superior */
        .toolbar {
            padding: 16px 24px;
            background-color: var(--navy);
            border-bottom: 1px solid var(--line-border);
            font-size: 18px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            color: var(--white);
            text-decoration: none;
            font-size: 18px;
        }

        /* Scrollable Container */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contenedor del Logo */
        .app-logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background-color: var(--navy-card);
            border: 1px solid var(--line-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .app-logo svg {
            width: 50px;
            height: 50px;
            fill: var(--green-accent);
        }

        .app-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--white);
            margin-bottom: 4px;
        }

        .app-version {
            font-size: 13px;
            color: var(--mut-text);
            margin-bottom: 16px;
        }

        .about-text {
            color: var(--mut-text);
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        /* Tarjeta de Especificaciones */
        .info-card {
            width: 100%;
            background-color: var(--navy-card);
            border: 1px solid var(--line-border);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--mut-text);
        }

        .info-card-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
        }

        .info-card-item:not(:last-child) {
            border-bottom: 1px solid var(--line-border);
        }

        .info-card-label {
            color: var(--mut-text);
        }

        .info-card-value {
            color: var(--white);
            font-weight: 500;
        }

        /* Separador */
        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--line-border);
            margin: 24px 0;
        }

        /* Botón de Acción */
        .btn-action {
            width: 100%;
            height: 50px;
            background: transparent;
            border: 1px solid var(--line-border);
            color: var(--white);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Navegación Inferior */
        .bottom-nav {
            background-color: var(--navy2);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--line-border);
            position: sticky;
            bottom: 0;
            width: 100%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--nav-item-inactive);
            text-decoration: none;
            font-size: 11px;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--nav-item-active);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Encabezado / Toolbar -->
    <div class="toolbar">
        <a href="{% url 'profile' %}" class="btn-back">←</a>
        <span>Acerca de</span>
    </div>

    <!-- Contenido Scrollable -->
    <div class="scroll-content">

        <!-- Logo e Identificación -->
        <div class="app-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>

        <div class="app-title">Starssenger</div>
        <div class="app-version">Versión 1.0.0</div>

        <div class="about-text">
            <p>Starssenger es una plataforma de mensajería segura orientada a garantizar la privacidad mediante algoritmos de cifrado avanzado y comunicación descentralizada.</p>
        </div>

        <!-- Detalles Técnicos -->
        <div class="info-card">
            <div class="info-card-item">
                <span class="info-card-label">Servidor</span>
                <span class="info-card-value">Conectado</span>
            </div>
            <div class="info-card-item">
                <span class="info-card-label">Cifrado</span>
                <span class="info-card-value">Extremo a Extremo</span>
            </div>
            <div class="info-card-item">
                <span class="info-card-label">Licencia</span>
                <span class="info-card-value">Propietario</span>
            </div>
        </div>

    </div>

</body>
</html>
