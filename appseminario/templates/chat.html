{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Starssenger - Chat{% endblock %}</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="{% static 'estilos.css' %}?v=123">

    {% block extra_head %}{% endblock %}
</head>
<body>

<main>
  <div id="chatScreen" class="screen on">
    <header style="display: flex; align-items: center; gap: 10px; padding: 10px 16px;">
      <button class="back" onclick="goHome()" title="Volver" aria-label="Atrás" style="background: none; border: none; font-size: 1.5rem; color: inherit; cursor: pointer;">←</button>
      <div class="av" id="chAv" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: bold;"></div>
      <div style="flex:1; min-width:0">
        <div style="font-weight:600; font-size:16px" id="chName">Cargando...</div>
        <div class="chsub" id="chSub" style="font-size:0.8rem; opacity:0.7;">En línea</div>
      </div>
      <div class="headbtns" style="display: flex; gap: 8px;">
        <button class="callbtn" onclick="voiceCurrent()" title="Llamada de voz" aria-label="Llamada de voz"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.28-.28.68-.36 1.02-.24 1.1.36 2.28.56 3.48.56.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.4 21 3 13.6 3 4.5c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.2.2 2.38.56 3.48.12.34.04.74-.24 1.02z"/></svg></button>
        <button class="callbtn" onclick="callCurrent()" title="Videollamada" aria-label="Videollamada"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="2" y="6" width="13" height="12" rx="2.5"/><path d="M17 10l4.1-2.35c.5-.29 1.12.07 1.12.65v7.4c0 .58-.62.94-1.12.65L17 14z"/></svg></button>
      </div>
    </header>

    <div id="chat" style="padding: 16px; overflow-y: auto; height: calc(100vh - 130px);"></div>

    <div id="bar" style="display: flex; align-items: center; padding: 10px; gap: 8px;">
      <input id="txt" placeholder="Mensaje cifrado…" oninput="toggleBarBtns()" onkeydown="if(event.key==='Enter')send()" style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff;">
      <button id="micBtn" onclick="toggleRec()" title="Mensaje de voz" aria-label="Mensaje de voz" style="background: none; border: none; color: inherit; cursor: pointer;"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M6 11a6 6 0 0 0 12 0h-1.6a4.4 4.4 0 0 1-8.8 0zM11.2 17.3V21h1.6v-3.7z"/></svg></button>
      <button id="sendBtn" onclick="send()" style="display:none; background: #0084ff; border: none; border-radius: 50%; width: 36px; height: 36px; color: #fff; cursor: pointer;">➤</button>
    </div>
  </div>
</main>
<script>
function utf8bytes(s){return Array.from(new TextEncoder().encode(s));}
function bytesToStr(b){return new TextDecoder().decode(new Uint8Array(b));}
function d2b(x){const y=new Array(8);for(let n=1;n<=8;n++){y[8-n]=x%2;x=Math.floor(x/2);}return y;}
function b2d(x){let y=0;for(let n=1;n<=8;n++)y+=x[8-n]*Math.pow(2,n-1);return y;}
function eybStr(s){const key=[];for(const ch of s)key.push(...d2b(ch.charCodeAt(0)&255));return key;}
function mf(k,M){let h=2166136261>>>0;for(const b of k){h^=b;h=Math.imul(h,16777619)>>>0;}const o=[];for(let i=0;i<M;i++){h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);o.push(((t^(t>>>14))>>>0)%2);}return o;}
function b2dMSB(b){let v=0,L=b.length;for(let n=1;n<=L;n++)v+=b[L-n]*Math.pow(2,n-1);return v;}
function fibo1(seed,N){let y=(seed>>>0)%256;const K=[];for(let n=0;n<N;n++){let x=0.444666+y/1e7;const r=3.611+y/1e4;x=r*x*(1-x);x=x-Math.floor(x);let acuy=0,byte=0;const row=[];for(let d=1;d<=8;d++){let yy=Math.floor(x*Math.pow(10,d))-acuy*10;acuy+=yy;const bit=((yy%2)+2)%2===0?0:1;row.push(bit);byte+=bit*Math.pow(2,d-1);}K.push(row);y=byte&255;}return K;}

const LS = k => localStorage.getItem(k);

// 1. Obtener usuario actual o inyectar fallback si no existe
let ME = LS('sp_me');
if (!ME || ME.trim() === "") {
    ME = "{{ request.user.username|default:'mi_usuario' }}";
    localStorage.setItem('sp_me', ME);
}

let SECURE = (LS('sp_secure') === '1') ? 1 : 0;
let contacts = JSON.parse(LS('sp_contacts') || '[]');
const convs = {};
let cur = null;

function room(mem) {
    let h = 5381;
    for (const c of mem.slice().sort().join('|')) {
        h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
    }
    return "starssenger/" + h.toString(36);
}

function initials(name) {
    const p = (name || '?').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function goHome() {
    window.location.href = "{% url 'home' %}";
}

function getConv(members, title, type) {
    const topic = room(members);
    if (!convs[topic]) {
        const offKey = 'sp_off_' + members.slice().sort().join('_') + '_' + ME;
        const off = SECURE ? (Math.floor(Math.random() * 1e9) + 1e6) : parseInt(LS(offKey) || '0', 10);
        const msgs = SECURE ? [] : JSON.parse(LS('sp_msgs_' + topic) || '[]');
        convs[topic] = { topic, title, members, type, messages: msgs, offOut: off, offKey, unread: 0 };
    } else {
        convs[topic].title = title;
        convs[topic].members = members;
    }
    return convs[topic];
}

function loadChatFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    // Permite obtener el destinatario de la URL Django o del contexto
    const targetPhone = urlParams.get('to') || "{{ target_phone }}";

    if (!targetPhone) {
        return; // Mantiene la pantalla visible sin rebotar a Home
    }

    const contact = contacts.find(c => c.phone_number === targetPhone || c.number === targetPhone);
    const chatName = contact ? (contact.name || contact.cName) : targetPhone;

    cur = getConv([...new Set([ME, targetPhone])], chatName, '1');

    document.getElementById('chName').textContent = cur.title;
    document.getElementById('chAv').textContent = initials(cur.title);

    renderMessages();
}

function renderMessages() {
    const chatContainer = document.getElementById('chat');
    if (!chatContainer || !cur) return;
    
    chatContainer.innerHTML = '';
    cur.messages.forEach(m => {
        const msgDiv = document.createElement('div');
        msgDiv.style.marginBottom = '8px';
        msgDiv.style.textAlign = m.from === ME ? 'right' : 'left';
        msgDiv.innerHTML = `<span style="background: ${m.from === ME ? '#0084ff' : 'rgba(255,255,255,0.1)'}; padding: 8px 12px; border-radius: 12px; display: inline-block;">${m.text}</span>`;
        chatContainer.appendChild(msgDiv);
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function toggleBarBtns() {
    const txt = document.getElementById('txt').value.trim();
    document.getElementById('micBtn').style.display = txt ? 'none' : 'block';
    document.getElementById('sendBtn').style.display = txt ? 'block' : 'none';
}

function send() {
    const input = document.getElementById('txt');
    const text = input.value.trim();
    if (!text || !cur) return;

    cur.messages.push({ from: ME, text: text, ts: Date.now() });
    
    if (!SECURE) {
        localStorage.setItem('sp_msgs_' + cur.topic, JSON.stringify(cur.messages));
    }

    input.value = '';
    toggleBarBtns();
    renderMessages();
}

function voiceCurrent() { alert("Llamada de voz no disponible."); }
function callCurrent() { alert("Videollamada no disponible."); }
function toggleRec() { alert("Mensaje de voz en desarrollo."); }

document.addEventListener('DOMContentLoaded', () => {
    loadChatFromURL();
});
</script>

</body>
</html>
