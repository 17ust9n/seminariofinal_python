{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Chat - Starssenger</title>
    <link rel="stylesheet" href="{% static 'estilos.css' %}?v=125">

    <!-- Cargamos Libsodium desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js" async></script>
</head>
<body>

<div class="wrap">
    <div id="newchat" class="screen on">
        <!-- Header con botón de regresar -->
        <header>
            <button class="back-btn" onclick="window.location.href='{% url 'home' %}'" title="Volver">
                &larr;
            </button>
            <b class="brand">Nuevo Chat</b>
        </header>

        <main style="padding: 16px; flex: 1; overflow-y: auto;">
            <!-- Botón Agregar Nuevo Contacto -->
            <button class="btn" onclick="openAddModal()" style="margin-bottom: 16px;">
                + Agregar nuevo contacto
            </button>

            <!-- Buscador estilizado -->
            <div class="searchwrap">
                <input id="newChatSearch" 
                       type="text" 
                       placeholder="Escribe el nombre o teléfono del contacto…" 
                       oninput="liveSearchNewChat()" 
                       autocomplete="off">
            </div>

            <!-- Lista de Contactos -->
            <div id="contacts-list">
                {% for contact in contacts %}
                    <div class="row contact-item" id="contact-item-{{ contact.id }}" onclick="openChat('{{ contact.phone_number }}')">
                        <!-- Avatar dinámico -->
                        <div class="av">
                            {{ contact.name|slice:":1"|upper }}
                        </div>

                        <!-- Información -->
                        <div class="rmid">
                            <div class="rname">{{ contact.name }}</div>
                            <div class="rprev">{{ contact.phone_number }}</div>
                        </div>

                        <!-- Acciones (Editar/Eliminar) -->
                        <div class="rright" onclick="event.stopPropagation();">
                            <button onclick="openEditModal('{{ contact.id }}', '{{ contact.name|escapejs }}', '{{ contact.phone_number|escapejs }}', '{{ contact.public_key|escapejs }}')" title="Editar" class="icon-btn">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                                </svg>
                            </button>
                            
                            <button onclick="deleteContact('{{ contact.id }}')" title="Eliminar" class="icon-btn dangerous">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                {% empty %}
                    <div class="empty">No tienes contactos guardados.</div>
                {% endfor %}
            </div>
        </main>

        <!-- Navegación Inferior (.tabs) -->
        <nav class="tabs">
            <button class="act" onclick="window.location.href='{% url 'home' %}'">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
                <span>Chats</span>
            </button>
            <button onclick="window.location.href='{% url 'profile' %}'">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>Perfil</span>
            </button>
        </nav>
    </div>
</div>

<!-- Modal para Agregar / Editar Contacto -->
<div id="contactModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1001;">
    <div class="modal-content" style="background: var(--card); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; color: var(--fg); border: 1px solid rgba(255,255,255,0.08);">
        <h3 id="modalTitle" style="margin-top: 0; color: var(--fg);">Agregar Contacto</h3>
        <input type="hidden" id="cId">
        
        <label for="cName">Nombre</label>
        <input type="text" id="cName" placeholder="Nombre completo" style="margin-bottom: 12px;">
        
        <label for="cNum">Teléfono</label>
        <input type="text" id="cNum" placeholder="Número de teléfono" style="margin-bottom: 12px;">
        
        <!-- Campo opcional para clave pública de Libsodium -->
        <label for="cPubKey">Clave Pública de Libsodium (Base64)</label>
        <input type="text" id="cPubKey" placeholder="Clave pública del contacto (opcional)" style="margin-bottom: 20px; font-size: 0.8rem;">

        <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
            <button onclick="closeModal()" class="btn ghost" style="width: auto; padding: 8px 16px;">Cancelar</button>
            <button onclick="saveContact()" class="btn" style="width: auto; padding: 8px 16px;">Guardar</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        await sodium.ready;
        console.log("Libsodium listo en nuevo chat.");
    } catch (e) {
        console.error("Error al cargar Libsodium:", e);
    }
});

function openChat(phone) {
    if (phone) window.location.href = `/chat/?to=${phone}`;
}

function openAddModal() {
    document.getElementById('modalTitle').textContent = 'Agregar Contacto';
    document.getElementById('cId').value = '';
    document.getElementById('cName').value = '';
    document.getElementById('cNum').value = '';
    document.getElementById('cPubKey').value = '';
    document.getElementById('contactModal').style.display = 'flex';
}

function openEditModal(id, name, phone, pubKey = '') {
    document.getElementById('modalTitle').textContent = 'Modificar Contacto';
    document.getElementById('cId').value = id;
    document.getElementById('cName').value = name;
    document.getElementById('cNum').value = phone;
    document.getElementById('cPubKey').value = pubKey;
    document.getElementById('contactModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('contactModal').style.display = 'none';
}

async function saveContact() {
    const cId = document.getElementById('cId').value;
    const cName = document.getElementById('cName').value.trim();
    const cNum = document.getElementById('cNum').value.trim();
    const cPubKey = document.getElementById('cPubKey').value.trim();

    if (!cName || !cNum) {
        alert('Por favor ingresa nombre y teléfono');
        return;
    }

    try {
        const response = await fetch('/modal/mContact/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ cId, cName, cNum, cPubKey })
        });
        const data = await response.json();
        if (data.status === 'success') {
            window.location.reload();
        } else {
            alert(data.message || 'Error al guardar contacto');
        }
    } catch (e) {
        console.error(e);
        alert('Error de conexión');
    }
}

async function deleteContact(id) {
    if (!confirm('¿Seguro que deseas eliminar este contacto?')) return;

    try {
        const response = await fetch('/modal/deleteContact/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ cId: id })
        });
        const data = await response.json();
        if (data.status === 'success') {
            window.location.reload();
        } else {
            alert(data.message || 'Error al eliminar contacto');
        }
    } catch (e) {
        console.error(e);
        alert('Error de conexión');
    }
}

let originalNewChatHTML = null;

async function liveSearchNewChat() {
    const listContainer = document.getElementById('contacts-list');
    
    if (originalNewChatHTML === null) {
        originalNewChatHTML = listContainer.innerHTML;
    }

    const query = document.getElementById('newChatSearch').value.trim();

    if (!query) {
        listContainer.innerHTML = originalNewChatHTML;
        return;
    }

    try {
        const response = await fetch(`/api/search-users/?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data.status === 'success') {
            listContainer.innerHTML = '';

            if (data.results.length === 0) {
                listContainer.innerHTML = '<div class="empty">No se encontraron usuarios.</div>';
                return;
            }

            data.results.forEach(user => {
                const item = document.createElement('div');
                item.className = 'row contact-item';
                item.onclick = () => openChat(user.phone_number);

                const initial = user.name ? user.name.charAt(0).toUpperCase() : '?';

                item.innerHTML = `
                    <div class="av">${initial}</div>
                    <div class="rmid">
                        <div class="rname">${user.name}</div>
                        <div class="rprev">${user.phone_number}</div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }
    } catch (e) {
        console.error(e);
    }
}
</script>

</body>
</html>
